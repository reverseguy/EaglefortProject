
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Fort | Neural Techwear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Montserrat:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --deep-bg: #0b0c10;
            --accent-glow: rgba(0, 210, 255, 0.5);
            --border-muted: rgba(0, 210, 255, 0.2);
            --card-bg: rgba(255, 255, 255, 0.05);
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Desaturated Darker Variant */
        .theme-desaturated {
            --neon-blue: #5c8d99;
            --deep-bg: #020203;
            --accent-glow: rgba(92, 141, 153, 0.3);
            --border-muted: rgba(255, 255, 255, 0.05);
            --card-bg: rgba(10, 10, 12, 0.6);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--deep-bg);
            color: white;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }
        h1, h2, h3, h4, h5, h6, .oswald {
            font-family: 'Oswald', sans-serif;
            letter-spacing: -0.02em;
        }
        .mono {
            font-family: 'Space Mono', monospace;
        }
        .cyber-clip {
            clip-path: polygon(8% 0, 100% 0, 100% 75%, 92% 100%, 0 100%, 0 25%);
        }
        .cyber-border {
            border: 1px solid var(--border-muted);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .cyber-border:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(0, 210, 255, 0.05);
        }
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 99;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, var(--accent-glow) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: fixed;
            bottom: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }
        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }
        .glitch-text:hover {
            animation: glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); color: #ff00ff; }
            40% { transform: translate(-2px, -2px); color: #00ffff; }
            60% { transform: translate(2px, 2px); color: #ffff00; }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        @keyframes marquee {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        .animate-marquee {
          animation: marquee 20s linear infinite;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--deep-bg); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); }
        .custom-scrollbar::-webkit-scrollbar {
          width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: var(--neon-blue);
        }

        /* Update tailwind classes to use CSS variables where possible */
        .bg-neon-blue { background-color: var(--neon-blue); }
        .text-neon-blue { color: var(--neon-blue); }
        .border-neon-blue { border-color: var(--neon-blue); }
        .bg-deep-bg { background-color: var(--deep-bg); }
        .shadow-neon { box-shadow: 0 0 15px var(--accent-glow); }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
    <div class="scanline"></div>
    <div id="root"></div>
</body>
</html>
